<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - FestEats</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #444; border-radius: 5px; }
        .test h3 { margin: 0 0 10px 0; color: #4ec9b0; }
        .success { background: #1e3a1e; border-color: #28a745; }
        .error { background: #3a1e1e; border-color: #dc3545; }
        .pending { background: #3a3a1e; border-color: #ffc107; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007acc; color: white; border: none; border-radius: 3px; }
        button:hover { background: #005a9e; }
        pre { background: #252526; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🧪 FestEats API Test Suite</h1>
    <p><strong>Backend URL:</strong> https://festeats12.onrender.com</p>
    <p><strong>Frontend URL:</strong> https://festeats123.netlify.app</p>
    
    <button onclick="runAllTests()">▶️ Run All Tests</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'https://festeats12.onrender.com';
        const resultsDiv = document.getElementById('results');

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        function addResult(title, status, data) {
            const div = document.createElement('div');
            div.className = `test ${status}`;
            div.innerHTML = `
                <h3>${status === 'success' ? '✅' : status === 'error' ? '❌' : '⏳'} ${title}</h3>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
            resultsDiv.appendChild(div);
        }

        async function testEndpoint(title, endpoint, options = {}) {
            addResult(title, 'pending', { message: 'Testing...' });
            try {
                const response = await fetch(`${API_URL}${endpoint}`, options);
                const data = await response.json().catch(() => response.text());
                
                resultsDiv.removeChild(resultsDiv.lastChild);
                
                if (response.ok) {
                    addResult(title, 'success', {
                        status: response.status,
                        statusText: response.statusText,
                        data: data
                    });
                } else {
                    addResult(title, 'error', {
                        status: response.status,
                        statusText: response.statusText,
                        error: data
                    });
                }
            } catch (error) {
                resultsDiv.removeChild(resultsDiv.lastChild);
                addResult(title, 'error', {
                    error: error.message,
                    type: error.name,
                    note: 'Possible CORS issue or backend is down'
                });
            }
        }

        async function runAllTests() {
            clearResults();
            
            // Test 1: Backend health/root
            await testEndpoint('1. Backend Root Endpoint', '/');
            
            // Test 2: Get menu items
            await testEndpoint('2. Get Menu Items (Food)', '/api/food');
            
            // Test 3: Auth endpoint (should return error without credentials)
            await testEndpoint('3. Auth Endpoint', '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@example.com', password: 'test123' })
            });
            
            // Test 4: Get orders (might require auth)
            await testEndpoint('4. Get Orders', '/api/orders');
            
            // Test 5: CORS preflight
            await testEndpoint('5. CORS Test (OPTIONS)', '/api/food', {
                method: 'OPTIONS'
            });
            
            // Summary
            addResult('Test Complete', 'success', {
                message: 'All tests completed',
                timestamp: new Date().toISOString()
            });
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            console.log('API Test Suite loaded');
            console.log('Backend URL:', API_URL);
        });
    </script>
</body>
</html>
